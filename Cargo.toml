[package]
name = "llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
default = ["cpu"]
cpu = []
# GPU backends - each enables specific hardware acceleration
gpu-cuda = ["cudarc", "cuda-12000"]
gpu-metal = ["dep:metal"]
gpu-wgpu = ["wgpu"]
# CUDA versions
cuda-11060 = ["cudarc/cuda-11060"]
cuda-12000 = ["cudarc/cuda-12000"]
cuda-12020 = ["cudarc/cuda-12020"]
# Convenience feature for all GPU backends
gpu-all = ["gpu-cuda", "gpu-metal", "gpu-wgpu"]

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
flate2 = "1.0"
ndarray = { version = "0.16.1", features = ["serde", "rayon", "approx"] }
rand = "0.9.2"
rand_distr = "0.5.0"
rayon = "1.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rkyv = { version = "0.7", features = ["validation"] }
sysinfo = "0.37"

# Web UI dependencies
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# GPU backend dependencies (optional)
# CUDA support via cudarc
cudarc = { version = "0.12", optional = true }
# Cross-platform GPU via WebGPU
wgpu = { version = "24.0", optional = true }
# Safe casting for GPU buffer operations
bytemuck = { version = "1.14", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Metal support (macOS only)
metal = { version = "0.28", optional = true }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.0"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "llm"
path = "src/lib.rs"

# Main binary
[[bin]]
name = "main"
path = "src/main.rs"

# Utility binaries
[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "debug_counts"
path = "src/bin/debug_counts.rs"

# Benchmarks
[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "attention_parallel"
harness = false

[[bench]]
name = "diffusion_block_bench"
harness = false

[[bench]]
name = "transformer_block"
harness = false

[[bench]]
name = "mamba_scan"
harness = false

[[bench]]
name = "csv_loading"
harness = false

[[bench]]
name = "richards_curve_bench"
harness = false

[[bench]]
name = "json_loading"
harness = false

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16
incremental = true

[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[profile.bench]
inherits = "release"

[[bench]]
name = "inference"
harness = false
