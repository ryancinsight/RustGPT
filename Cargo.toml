[package]
name = "llm"
version = "0.1.0"
# 2024 = latest edition
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
ndarray = { version = "0.16.1", features = ["serde", "rayon"] }
rand = "0.9.2"
rand_distr = "0.5.0"
rayon = "1.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rkyv = { version = "0.7", features = ["validation"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.0"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "llm"
path = "src/lib.rs"

[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "attention_parallel"
harness = false

[[bench]]
name = "diffusion_block_bench"
harness = false

[[bench]]
name = "transformer_block"
harness = false

[[bench]]
name = "mamba_scan"
harness = false

[[bin]]
name = "main"
path = "src/main.rs"

[[bin]]
name = "test_fix_validation_simple"
path = "test_fix_validation_simple.rs"

[[bin]]
name = "test_sigmoid_gompertz_validation"
path = "test_sigmoid_gompertz_validation.rs"

[[bin]]
name = "test_richards_attention"
path = "test_richards_attention.rs"

[[bin]]
name = "test_swiglu_richards"
path = "test_swiglu_richards.rs"

[[bin]]
name = "test_none_variant"
path = "test_none_variant.rs"

[[bin]]
name = "test_parameter_learning_validation"
path = "test_parameter_learning_validation.rs"

[[bin]]
name = "test_dramatic_learning"
path = "test_dramatic_learning.rs"

[[bin]]
name = "test_poly_attention_none_variant"
path = "test_poly_attention_none_variant.rs"

[[bin]]
name = "test_learning_bug_demo"
path = "test_learning_bug_demo.rs"

[[bin]]
name = "debug_counts"
path = "src/bin/debug_counts.rs"

[[bench]]
name = "csv_loading"
harness = false
