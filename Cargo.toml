[package]
name = "llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
ndarray = { version = "0.16.1", features = ["serde", "rayon", "approx"] }
rand = "0.9.2"
rand_distr = "0.5.0"
rayon = "1.8"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
clap = { version = "4.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rkyv = { version = "0.7", features = ["validation"] }

[dev-dependencies]
proptest = "1.5"
tempfile = "3.0"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[lib]
name = "llm"
path = "src/lib.rs"

# Main binary
[[bin]]
name = "main"
path = "src/main.rs"

# Utility binaries
[[bin]]
name = "infer"
path = "src/bin/infer.rs"

[[bin]]
name = "debug_counts"
path = "src/bin/debug_counts.rs"

# Benchmarks
[[bench]]
name = "encoding"
harness = false

[[bench]]
name = "attention_parallel"
harness = false

[[bench]]
name = "diffusion_block_bench"
harness = false

[[bench]]
name = "transformer_block"
harness = false

[[bench]]
name = "mamba_scan"
harness = false

[[bench]]
name = "csv_loading"
harness = false

[[bench]]
name = "richards_curve_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

[[bench]]
name = "inference"
harness = false
